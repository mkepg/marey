<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The default scene's sun (R = 27, centre 32,30) above three ridges, on a dusk tile. -->
  <style>
    .eye { stroke-width: 0 }
    /* At tab size the brows fall below a pixel and blur into the eyes, so they are
       dropped and the eyes and smile are drawn heavier. */
    @media (max-width: 24px) {
      .brow { display: none }
      .eye { stroke-width: 1.3 }
      .smile { stroke-width: 3; stroke-linecap: butt }
    }
  </style>
  <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#3f3772"/>
    <circle cx="32" cy="30" r="27" fill="#feb93e"/>
    <circle cx="32" cy="27.76" r="25.87" fill="#fecd5e"/>
    <g class="eye" fill="#232323" stroke="#232323">
      <circle cx="24.41" cy="19.61" r="2.54"/>
      <circle cx="39.59" cy="19.61" r="2.54"/>
    </g>
    <g fill="none" stroke="#232323" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path class="brow" d="M21.88 15.93 25.52 15.37M42.13 15.93 38.48 15.37"/>
      <path class="smile" d="M27.22 25.49 27.9 26.03 28.65 26.49 29.44 26.85 30.27 27.11 31.13 27.27 32 27.33 32.87 27.27 33.73 27.11 34.56 26.85 35.35 26.49 36.1 26.03 36.78 25.49"/>
    </g>
    <path d="M0 39 9 35.5 18 38.5 27 34.5 38 39 47 35.5 56 39.5 64 36.5V64H0Z" fill="#6b4a7a"/>
    <path d="M0 45.5 12 42.5 22 46.5 33 43 44 47 54 43.5 64 46V64H0Z" fill="#4a3560"/>
    <path d="M0 53 10 51 21 54.5 33 51.5 45 55 56 52 64 54V64H0Z" fill="#2a1f3d"/>
  </g>
</svg>
